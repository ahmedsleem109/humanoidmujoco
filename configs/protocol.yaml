# Experimental protocol — Robust Humanoid Locomotion Under Disturbances
#
# FROZEN BEFORE ANY POLICY IS TRAINED. That is the entire point of this file.
#
# The generalization claim in section 16 of the brief is only meaningful if the
# "unseen" distribution was defined before we knew which policy would win. Fixing
# it afterwards — even honestly, even without looking — is unfalsifiable, because
# nothing stops the boundary being nudged to where the result is favourable.
#
# Anything changed here after training starts must be recorded in
# ROBUSTNESS_LOG.md as a dated amendment, with the reason, and the affected
# results re-run. Do not edit silently.

meta:
  frozen_utc: "2026-08-16"
  robot: unitree_g1_29dof
  terrain: flat
  simulator: mjlab 1.2.0 / mujoco-warp 3.5.0
  seed_train: 0
  seed_eval: 12345          # disjoint from training, deliberately

# ---------------------------------------------------------------------------
# TRAINING distribution — what P2 and P3 are exposed to.
# ---------------------------------------------------------------------------
train:
  iterations: 6600
  num_envs: 4096
  # Identical for all three arms. Only `events` differs; see robust_env_cfg.py.

  disturbance:                    # P2, P3 only
    func: mjlab.envs.mdp.apply_body_impulse
    body: torso_link
    force_range_per_component_n: [-200.0, 200.0]
    # NOTE: components are sampled independently, so the realised magnitude
    # reaches |F|*sqrt(3) ~ 346 N and is corner-biased. This is fine as a
    # training distribution and is why evaluation uses `deterministic_push`
    # instead.
    max_realisable_magnitude_n: 346
    torque_range_nm: [0.0, 0.0]
    duration_s: [0.05, 0.20]
    cooldown_s: [2.0, 5.0]

  domain_randomization:           # P3 only
    foot_friction: [0.5, 1.3]     # ~ +/-30% about 0.9
    link_mass_scale: [0.85, 1.15]
    joint_damping_scale: [0.8, 1.2]
    joint_friction_scale: [0.8, 1.2]
    actuator_pd_gain_scale: [0.9, 1.1]
    encoder_bias_rad: [-0.015, 0.015]
    base_com_offset_m: [-0.05, 0.05]
    reset_joint_pos_rad: [-0.1, 0.1]
    reset_joint_vel_rad_s: [-0.2, 0.2]

  fixed_for_p1_and_p2:
    foot_friction: [0.9, 0.9]     # pinned, not deleted: same mean, zero variance
    encoder_bias: disabled
    base_com_offset: disabled

# ---------------------------------------------------------------------------
# EVALUATION — in-distribution. Inside the training support.
# ---------------------------------------------------------------------------
eval_in_distribution:
  command:
    lin_vel_x_m_s: 1.0            # fixed; no heading command, no standing envs
    lin_vel_y_m_s: 0.0
    ang_vel_z_rad_s: 0.0
  push:
    func: src.tasks.velocity.mdp.disturbance.deterministic_push
    body: torso_link
    duration_s: 0.1               # matches the published G1 benchmark protocol
    trigger_time_s: 3.0           # after a steady gait is established
    magnitudes_n: [0, 50, 100, 150, 200, 250, 300, 350]
    directions_deg: [0, 45, 90, 135, 180, 225, 270, 315]
  episodes_per_cell: 64
  episode_length_s: 7.0

# ---------------------------------------------------------------------------
# EVALUATION — UNSEEN. Strictly outside the training support.
# ---------------------------------------------------------------------------
#
# Honest note on what is and is not "unseen":
#
#   Direction is NOT a generalization axis. Training samples force components
#   independently, which already covers every azimuth. Claiming novel directions
#   would be false. Directions are still swept, but as a *failure-mode* axis
#   (section 18), not a generalization axis.
#
# The genuinely unseen axes are magnitude beyond the training maximum, dynamics
# outside the randomized ranges, and disturbance structures never trained on.
unseen:
  magnitude:
    magnitudes_n: [400, 450, 500, 550, 600, 700, 800]
    rationale: "above the 346 N maximum realisable during training"

  dynamics:
    foot_friction: [0.35, 1.6]        # ~ +/-50%, wider than the trained +/-30%
    link_mass_scale: [0.75, 1.25]
    joint_damping_scale: [0.7, 1.3]
    rationale: "outside the trained randomization support on every axis"

  structure:
    consecutive_pushes:
      count: 2
      separation_s: 0.6
      rationale: "training cooldown is 2-5 s; two pushes 0.6 s apart never occur"
    duration_s: 0.35
      # longer than the trained 0.05-0.20 s: a shove rather than an impulse
    gait_phase_locked: single_support
      rationale: "training timing is uniform; locking to single support targets
                  the hardest phase and was never selectively trained"

# ---------------------------------------------------------------------------
# METRIC DEFINITIONS — fixed here so they cannot drift between arms.
# ---------------------------------------------------------------------------
metrics:
  fall:
    tilt_deg: 45.0                # torso deviation from vertical
    also: "environment termination"
  recovered:
    window_s: 3.0                 # from the push instant
    settle_s: 0.5                 # both conditions held continuously
    stable_tilt_deg: 15.0
    vel_tol_factor: 1.5           # of the pre-push mean tracking error
    vel_tol_floor_m_s: 0.30
    note: >
      The velocity condition is load-bearing. A policy that survives by freezing
      in a crouch satisfies every tilt bound and must not score as a recovery:
      the brief's section 12 rule is "reward task completion, not just survival",
      and the metric has to agree with the reward about that.
  recovery_time_s: "push instant -> start of the sustained-stable interval"
  velocity_loss: "integral of tracking error above the pre-push mean over the window"
  f_star_n: "linearly interpolated force at which recovery rate crosses 0.50"
  peak_dv_m_s: >
    Sanity channel, not a result: largest root-speed deviation within 0.3 s of
    the impulse. Must scale with commanded force. If it does not, the push is
    not reaching the solver and no other number in the run means anything.

reporting:
  always_report_n: true
  # A rate without a sample count is not a result. This rule exists because a
  # metric bug at R1.1 silently dropped exactly the failed episodes, leaving
  # recovery rates of 1.000 computed over n=2.
  normalise_impulse_by_body_weight: true
  # Impulse as %-of-body-weight-seconds, so the number is comparable to the
  # published MPC and RL push-recovery literature rather than only to itself.
